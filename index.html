<style>
  #recommendations .path-topic {
    margin-block: 1.5rem;
  }

  #recommendations li {
    margin-block: .5rem;
  }

  #recommendations summary {
    cursor: pointer;
  }
</style>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const quiz = document.getElementById('quiz');
  const learningPath = document.getElementById('learning-path');
  const directory = document.getElementById('directory');
  const form = document.getElementById('quiz-form');
  const role = document.getElementById('role');
  const experience = document.getElementById('experience');
  const status = document.getElementById('quiz-status');
  const oldResults = document.getElementById('recommendations');

  directory.before(quiz, learningPath);

  const results = document.createElement('div');
  results.id = 'recommendations';
  oldResults.replaceWith(results);

  const focus = document.getElementById('focus');
  if (focus) {
    focus.required = false;
    focus.disabled = true;
    const label = focus.closest('label');
    if (label) label.hidden = true;
    else focus.hidden = true;
  }

  let advanced = [...experience.options].find(option => option.value === 'Advanced');
  if (!advanced) {
    advanced = new Option('Advanced', 'Advanced');
    experience.add(advanced);
  }

  const topics = [
    {
      title: ['I. Interoperability fundamentals', 'I. Bases de l’interopérabilité'],
      core: [
        'interoperability-intro-and-part-1',
        'interoperability-part-2',
        'interoperability-part-3',
        'foundations-of-health-information-exchange'
      ],
      extra: [
        'digital-health-planning-national-systems',
        'public-health-interoperability-training-catalog'
      ]
    },
    {
      title: ['II. Standards and terminologies', 'II. Normes et terminologies'],
      core: ['medblocks-fhir-fundamentals', 'loinc', 'snomed-ct', 'icd-11', 'ucum', 'dicom'],
      extra: ['hl7-fhir', 'interopen-terminology-learnathon', 'nhs-fhir-terminology-exercises']
    },
    {
      title: ['III. Interoperability architecture', 'III. Architecture d’interopérabilité'],
      core: ['openhie-architecture-overview'],
      extra: ['dhis2-fundamentals', 'dhis2-integration-concepts', 'ihe-technical-framework']
    },
    {
      title: ['IV. Laws and data governance', 'IV. Législation et gouvernance des données'],
      core: ['african-union-data-policy-framework', 'african-union-hie-guidelines-and-standards'],
      extra: ['malabo-convention', 'afcfta-digital-trade', 'general-data-protection-regulation-gdpr']
    },
    {
      title: ['V. Health data spaces', 'V. Espaces de données de santé'],
      core: ['ahds-project-website', 'ehds-regulation-overview-and-timeline'],
      extra: [
        'ahds-cross-border-prototype',
        'frequently-asked-questions-on-the-european-health-data-space',
        'ehds-implementation-webinar'
      ]
    }
  ];

  // Each row has one recommendation for each of the five topics, in order.
  const paths = {
    learner: {
      Beginner: [
        'digital-health-planning-national-systems',
        'health-data-standards',
        'dhis2-fundamentals',
        'digital-health-blueprint',
        'frequently-asked-questions-on-the-european-health-data-space'
      ],
      Intermediate: [
        'immunization-information-systems-elearning',
        'interopen-terminology-learnathon',
        'digital-health-platform-handbook',
        'malabo-convention',
        'digital-health-systems-and-data-sovereignty'
      ],
      Advanced: [
        'public-health-interoperability-training-catalog',
        'nhs-fhir-terminology-exercises',
        'ihe-technical-framework',
        'recommendation-on-health-data-governance',
        'fair-health-infrastructure-africa'
      ]
    },
    implementer: {
      Beginner: [
        'immunization-information-systems-elearning',
        'introduction-to-interoperability-and-fhir',
        'dhis2-fundamentals',
        'digital-health-blueprint',
        'frequently-asked-questions-on-the-european-health-data-space'
      ],
      Intermediate: [
        'public-health-interoperability-training-catalog',
        'interopen-terminology-learnathon',
        'dhis2-integration-concepts',
        'african-continental-health-data-governance-framework',
        'ahds-cross-border-prototype'
      ],
      Advanced: [
        'interoperability-in-healthcare-towards-an-interconnected-future',
        'nhs-fhir-terminology-exercises',
        'data-exchange-specification',
        'igad-health-data-sharing',
        'fair-health-infrastructure-africa'
      ]
    },
    policy: {
      Beginner: [
        'digital-health-planning-national-systems',
        'health-data-standards',
        'digital-health-platform-handbook',
        'digital-health-blueprint',
        'digital-health-systems-and-data-sovereignty'
      ],
      Intermediate: [
        'interoperability-in-healthcare-towards-an-interconnected-future',
        'introduction-to-interoperability-and-fhir',
        'health-information-exchange-maturity-assessment-tool',
        'african-continental-health-data-governance-framework',
        'ehds-secondary-use-webinar'
      ],
      Advanced: [
        'public-health-interoperability-training-catalog',
        'interopen-terminology-learnathon',
        'digital-adaptation-kits',
        'afcfta-digital-trade-annexes',
        'european-health-data-space-regulation-eu-2025-327'
      ]
    }
  };

  const extraLinks = {
    'interoperability-intro-and-part-1': [
      'University of Utah, Part 1: Introduction to interoperability',
      'https://mediaspace.utah.edu/playlist/dedicated/1_g4nr8pm0/1_sc4s3lfg'
    ],
    'interoperability-part-2': [
      'University of Utah, Part 2: Terminology and data exchange standards',
      'https://mediaspace.utah.edu/playlist/dedicated/1_g4nr8pm0/1_54bql655'
    ],
    'interoperability-part-3': [
      'University of Utah, Part 3: The role of public health experts',
      'https://mediaspace.utah.edu/playlist/dedicated/1_g4nr8pm0/1_uvt8uyvn'
    ],
    'medblocks-fhir-fundamentals': [
      'Medblocks FHIR® Fundamentals',
      'https://medblocks.com/training/courses/fhir-fundamentals'
    ],
    'interopen-terminology-learnathon': [
      'Terminology Server: The Learnathon',
      'https://www.youtube.com/watch?v=EBXtmTshNJ4'
    ],
    'nhs-fhir-terminology-exercises': [
      'NHS England: Use FHIR Terminology Service APIs',
      'https://digital.nhs.uk/services/terminology-server/how-to-use-the-terminology-server/use-fhir-terminology-service-apis'
    ],
    'afcfta-digital-trade': [
      'AfCFTA Protocol on Digital Trade',
      'https://www.au.int/en/treaties/protocol-agreement-establishing-african-continental-free-trade-area-digital-trade'
    ],
    'afcfta-digital-trade-annexes': [
      'AfCFTA Digital Trade Protocol: Compiled Annexes',
      'https://www.au.int/sites/default/files/treaties/44963-ax-ENG_Circulation_Digital_Trade_Compiled_Certified_Legal_Instruments_38thAssembly_Feb_2025_27_May2025.pdf'
    ],
    'igad-health-data-sharing': [
      'IGAD Regional Health Data Sharing and Protection Policy Framework',
      'https://igad.int/download/igad-regional-health-data-sharing-and-protection-policy-framework/'
    ],
    'ahds-project-website': [
      'Africa Health Data Space: Project Website',
      'https://aun.mu.edu.et/ahds/about/'
    ],
    'ahds-cross-border-prototype': [
      'Africa Health Data Space: Description of a Cross-Border Prototype',
      'https://www.researchgate.net/publication/417064846_Africa_Health_Data_Space_Description_of_a_Cross-Border_Prototype'
    ],
    'fair-health-infrastructure-africa': [
      'Design of a FAIR digital data health infrastructure in Africa',
      'https://doi.org/10.1002/ggn2.10050'
    ]
  };

  function label(english, french) {
    return document.documentElement.lang.startsWith('fr') ? french : english;
  }

  function element(tag, text = '') {
    const node = document.createElement(tag);
    node.textContent = text;
    return node;
  }

  function resourceList(ids, catalogue, ordered = false) {
    const list = element(ordered ? 'ol' : 'ul');

    for (const id of ids) {
      const item = catalogue.get(id);
      const fallback = extraLinks[id];
      const title = fallback?.[0] ?? item?.title;
      const url = item?.url && item.url !== '#' ? item.url : fallback?.[1];

      if (!title || !url) continue;

      const row = element('li');
      const link = element('a', title);
      link.href = url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      row.append(link);

      if (item && typeof renderSaveButton === 'function' && typeof toggleBookmark === 'function') {
        const save = element('button');
        save.type = 'button';
        save.className = 'secondary';
        renderSaveButton(save, item);
        save.addEventListener('click', () => toggleBookmark(item));
        row.append(document.createTextNode(' '), save);
      }

      list.append(row);
    }

    return list;
  }

  function showRecommendations() {
    const picks = paths[role.value]?.[experience.value];
    if (!picks) return;

    if (typeof resources === 'undefined' || !resources.length) {
      status.textContent = label(
        'The resource list is unavailable. Try reloading this page.',
        'La liste des ressources est indisponible. Essayez de recharger la page.'
      );
      return;
    }

    const catalogue = new Map(resources.map(item => [item.id, item]));

    const groups = topics.map((topic, index) => {
      const group = element('div');
      group.className = 'path-topic';

      const tailored = picks[index];
      const existing = new Set([...topic.core, tailored]);
      const additional = topic.extra.filter(id => !existing.has(id));

      const details = element('details');
      const summary = element(
        'summary',
        label('Additional materials to read', 'Ressources complémentaires à consulter')
      );
      summary.className = 'button secondary';
      details.append(summary, resourceList(additional, catalogue));

      group.append(
        element('h3', label(...topic.title)),
        resourceList(topic.core, catalogue, true),
        element('p', label(
          'Recommended for your role and level',
          'Recommandé pour votre rôle et votre niveau'
        )),
        resourceList([tailored], catalogue),
        details
      );

      return group;
    });

    results.replaceChildren(...groups);
    status.textContent = label(
      'Your suggested learning order',
      'Votre parcours d’apprentissage suggéré'
    );
  }

  // Capture the submit event before the older quiz handler can render its list.
  form.addEventListener('submit', event => {
    event.preventDefault();
    event.stopImmediatePropagation();
    showRecommendations();
  }, true);

  const syncLanguage = () => {
    advanced.textContent = label('Advanced', 'Avancé');
    if (results.children.length) showRecommendations();
  };

  new MutationObserver(syncLanguage).observe(document.documentElement, {
    attributes: true,
    attributeFilter: ['lang']
  });

  syncLanguage();
});
</script>
